<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สมัครสมาชิก - PROMISE</title>
<style>body{margin:0;background:#fdf8ef;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;font-family:sans-serif}.card{background:white;border-radius:24px;padding:32px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.08);border:1px solid #f1e6d3}input{width:100%;padding:14px 18px;border-radius:12px;border:1px solid #e5e7eb;margin-top:14px;font-size:15px}button{width:100%;margin-top:20px;padding:14px;border-radius:12px;background:#111827;color:white;border:none;font-size:16px;cursor:pointer}.msg{margin-top:14px;font-size:13px}</style>
</head>
<body>
<div class="card">
<h1>สมัครสมาชิก</h1>
<p style="color:#6b7280;font-size:14px">สมัครด้วยอีเมลจริงเท่านั้น</p>
<form id="form">
<input id="email" type="email" placeholder="อีเมล" required value="theerapong.thana@gmail.com">
<input id="password" type="password" placeholder="รหัสผ่าน 8 ตัวขึ้นไป" required>
<input id="display_name" type="text" placeholder="ชื่อเล่นที่อยากให้เราเรียก" required value="พีช">
<button id="btn" type="submit">สมัครและไปตั้งค่าดวงเกิด →</button>
<div id="msg" class="msg"></div>
</form>
<div style="margin-top:16px;text-align:center;font-size:13px"><a href="/login.html">มีบัญชีแล้ว? เข้าสู่ระบบ</a></div>
</div>
<script>
const msg=document.getElementById('msg');const btn=document.getElementById('btn');
document.getElementById('form').addEventListener('submit', async (e)=>{
 e.preventDefault();btn.disabled=true;msg.textContent='กำลังสมัคร...';
 try{
   const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,display_name:display_name.value})});
   const data=await res.json().catch(()=>({error:'no json'}));
   if(res.ok){localStorage.setItem('token',data.token);localStorage.setItem('user',JSON.stringify(data.user));location.href='/onboarding.html';}
   else if(res.status===409){msg.innerHTML='อีเมลนี้สมัครแล้ว <a href="/login.html">ไปล็อกอินเลย</a>';msg.style.color='#dc2626';}
   else{msg.textContent=data.error||'สมัครไม่ได้';msg.style.color='#dc2626';console.log(data);}
 }catch(err){msg.textContent='API ไม่ตอบ: ต้อง deploy แบบ wrangler + ผูก DB';console.error(err);}
 btn.disabled=false;
});
</script>
</body>
</html>
