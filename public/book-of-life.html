<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • Book of Life</title><link rel="stylesheet" href="/css/promise.css"><style>main{max-width:920px;margin:40px auto;padding:22px}.chapter{margin:20px 0;padding:25px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#191a21,#101116)}.chapter h2{color:#e5c158;font-weight:400}.muted{color:#aaa}.piece{border-top:1px solid #ffffff14;padding:11px 0;line-height:1.9}.piece b{color:#e5c158}.watermark{position:fixed;bottom:12px;right:14px;color:#ffffff55;font-size:10px;pointer-events:none}</style></head><body><main><p class="eyebrow">BOOK OF LIFE · NATAL FOUNDATION</p><h1>หนังสือชีวิต</h1><p id="status" class="muted">กำลังเรียบเรียงบทอ่าน…</p><div id="chapters"></div></main><div id="watermark" class="watermark"></div><script>(()=>{const t=localStorage.getItem('token'),status=document.querySelector('#status'),out=document.querySelector('#chapters');if(!t){status.textContent='กรุณาเข้าสู่ระบบ';return}const topics=[{id:'self',title:'ตัวตนและแก่นชีวิต',systems:['western_natal','human_design','numerology'],fallback:['แก่นดวงชวนให้สังเกตว่าอะไรทำให้คุณรู้สึกมีชีวิตชีวา','ช่วงนี้เหมาะกับการกลับมาจัดลำดับสิ่งสำคัญ','โอกาสเกิดจากการเลือกก้าวเล็กที่ตรงกับคุณค่า','ระวังการเร่งหาคำตอบก่อนฟังตัวเอง','คุณมีสิทธิ์เติบโตตามจังหวะของตนเอง']},{id:'work',title:'การงานและความสำเร็จ',systems:['bazi','western_natal','thai'],fallback:['จุดแข็งของคุณปรากฏชัดเมื่อได้ทำงานอย่างมีความหมาย','สถานการณ์ต้องการทั้งความอดทนและการสื่อสารตรงไปตรงมา','เปิดรับความร่วมมือและแบ่งเป้าหมายเป็นขั้นตอน','อย่ารับภาระทุกอย่างไว้เพียงลำพัง','ความก้าวหน้าที่มั่นคงเริ่มจากสิ่งที่ทำได้วันนี้']},{id:'wealth',title:'การเงินและโชคลาภ',systems:['numerology','bazi','thai_7_9'],fallback:['วางคุณค่าของเวลาและทรัพยากรให้ชัดก่อนตัดสินใจ','จังหวะนี้เหมาะกับการตรวจทานแผนและค่าใช้จ่าย','ความรู้และวินัยเปิดทางเลือกที่ยั่งยืนกว่า','ระวังการเสี่ยงเพราะความรีบหรือคำชวนที่ตรวจสอบไม่ได้','ความมั่นคงสร้างได้จากการเลือกอย่างรอบคอบ']},{id:'love',title:'ความรักและความสัมพันธ์',systems:['western_natal','ziwei','human_design'],fallback:['ความสัมพันธ์ที่ดีเริ่มจากความซื่อตรงต่อตัวเอง','ช่วงนี้การฟังให้จบสำคัญกว่าการรีบตอบ','โอกาสคือการพูดความต้องการด้วยความอ่อนโยน','รักษาขอบเขตและอย่าคาดเดาแทนอีกฝ่าย','คุณคู่ควรกับความสัมพันธ์ที่เคารพตัวตนของคุณ']}];function entries(corpus){if(Array.isArray(corpus))return corpus;if(corpus&&Array.isArray(corpus.entries))return corpus.entries;return[]}function choose(corpus,system,category,slot){const rows=entries(corpus).filter(x=>x&&typeof x==='object');const row=rows.find(x=>(!x.system_id||x.system_id===system)&&(!category||x.category===category)&&x.slots?.[slot])||rows.find(x=>x.slots?.[slot]);return row?.slots?.[slot]||null}function appendPiece(card,label,text){const p=document.createElement('p');p.className='piece';const b=document.createElement('b');b.textContent=label+' · ';p.append(b,document.createTextNode(text));card.append(p)}fetch('/api/account',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()).then(a=>{const u=a.user||{};document.querySelector('#watermark').textContent=(u.display_name||u.email||'PROMISE')+' · '+new Date().toLocaleString('th-TH');if(!['vip','lifetime'].includes(String(u.tier||'').toLowerCase())){status.textContent='หนังสือชีวิตนี้ต้องใช้สมาชิก VIP ตลอดชีพ';throw Error('tier')}return fetch('/api/profile/charts',{headers:{Authorization:'Bearer '+t}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'โหลดดวงไม่สำเร็จ');const results=d.results||{},corpus=d.knowledge||{};topics.forEach((topic,index)=>{const card=document.createElement('section');card.className='chapter';const h=document.createElement('h2');h.textContent=topic.title;card.append(h);const system=topic.systems.find(s=>results[s]&&!results[s].error)||topic.systems[0];const data=results[system]||{};const markers=Object.entries(data).filter(([k,v])=>!['system','method'].includes(k)&&typeof v!=='object').slice(0,3).map(([k,v])=>`${k.replaceAll('_',' ')} ${v}`).join(' · ');const corpusRows=entries(corpus[system]);const cat=['self','work','money','love'][index];const labels=['นิสัยแก่นดวง','สถานการณ์ชีวิต','โอกาส','จุดเตือนสติ','ถ้อยคำปิดท้าย'];const slots=['habit','situation','opportunity','warning','warm_close'];slots.forEach((slot,i)=>{let text=choose(corpus[system],system,cat,slot);if(!text)text=topic.fallback[i];if(i===0&&markers)text+=` (ตัวชี้วัดจาก${system}: ${markers})`;appendPiece(card,labels[i],text)});out.append(card)});status.textContent='เรียบเรียง 4 บทจากดวงกำเนิดและคลังความรู้ที่มีให้บริการ'})}).catch(e=>{if(e.message!=='tier')status.textContent=e.message})})();</script></body></html>
