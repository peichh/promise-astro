<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • Book of Life</title><link rel="stylesheet" href="/css/promise.css"><style>main{max-width:850px;margin:40px auto;padding:22px}.chapter{margin:16px 0;padding:24px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#191a21,#101116);line-height:1.95}.chapter h2{color:#e5c158;font-weight:400}.muted{color:#aaa}.watermark{position:fixed;bottom:12px;right:14px;color:#ffffff55;font-size:10px;pointer-events:none}</style></head><body><main><p class="eyebrow">BOOK OF LIFE</p><h1>หนังสือชีวิต</h1><p id="status" class="muted">กำลังเปิดบทอ่าน…</p><div id="chapters"></div></main><div id="watermark" class="watermark"></div><script>(()=>{const t=localStorage.getItem('token'),status=document.querySelector('#status'),out=document.querySelector('#chapters');if(!t){status.textContent='กรุณาเข้าสู่ระบบ';return}fetch('/api/account',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()).then(a=>{const u=a.user||{},name=u.display_name||u.email?.split('@')[0]||'คุณ';document.querySelector('#watermark').textContent=(u.display_name||u.email||'PROMISE')+' · '+new Date().toLocaleString('th-TH');if(!['vip','lifetime'].includes(String(u.tier||'').toLowerCase())){status.textContent='หนังสือชีวิตนี้ต้องใช้สมาชิก VIP ตลอดชีพ';return Promise.reject(Error('tier'))}return fetch('/api/profile/charts',{headers:{Authorization:'Bearer '+t}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'โหลดดวงไม่สำเร็จ');const x=d.results||{},w=x.western_natal||{},n=x.numerology||{},b=x.bazi||{},hd=x.human_design||{};const parts=[['นิสัยแก่นดวง',`ดวงพื้นฐานสะท้อนตัวตนที่กำลังเรียนรู้จะใช้จุดแข็งอย่างมีจังหวะ${w.sun_long!=null?' โดยตำแหน่งอาทิตย์กำเนิดอยู่ที่ '+Math.round(w.sun_long)+' องศา':''} ความชัดเจนเกิดขึ้นเมื่อคุณซื่อสัตย์กับสิ่งที่ให้ความหมายแก่ชีวิต`],['สถานการณ์ชีวิต','ช่วงนี้เหมาะกับการจัดระเบียบสิ่งที่รับผิดชอบและแยกเรื่องเร่งด่วนออกจากเรื่องสำคัญ อย่าปล่อยให้เสียงภายนอกกลบความต้องการที่แท้จริง'],['โอกาส',`ใช้ความสามารถในการเรียนรู้และปรับตัวเป็นสะพานไปสู่โอกาสใหม่${n.lifePath!=null?' เลขเส้นทางชีวิต '+n.lifePath+' เป็นอีกกรอบหนึ่งสำหรับการทบทวนแรงขับของคุณ':''} เริ่มจากการลงมือเล็กๆ ที่ตรวจสอบผลได้`],['จุดเตือนสติ','ระวังการแบกรับทุกอย่างไว้คนเดียว หรือสรุปผลจากข้อมูลไม่ครบ การพักและการขอความช่วยเหลือเป็นส่วนหนึ่งของความก้าวหน้า'],['ถ้อยคำปิดท้าย','ดวงเป็นแผนที่สำหรับตั้งคำถาม ไม่ใช่คำตัดสินอนาคต คุณยังเป็นผู้เลือกทิศทางและความหมายของแต่ละบท']];for(const [title,text] of parts){const s=document.createElement('section');s.className='chapter';const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=text;s.append(h,p);out.append(s)}status.textContent='อ่านดวงกำเนิด 10 ระบบและเรียบเรียงเป็นบทอ่านส่วนตัว · '+name;})}).catch(e=>{if(e.message!=='tier')status.textContent=e.message})})();</script></body></html>
