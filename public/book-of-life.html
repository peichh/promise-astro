<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • Book of Life</title><link rel="stylesheet" href="/css/promise.css"><style>main{max-width:850px;margin:40px auto;padding:20px}.panel{margin:18px 0;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.chapter{padding:14px 0;border-bottom:1px solid var(--line);line-height:2}</style></head><body><main><p class="eyebrow">BOOK OF LIFE</p><h1>หนังสือชีวิต</h1><p id="status" role="status">กำลังโหลดบทอ่านจากคลังความรู้…</p><div id="chapters"></div></main><script>(()=>{const token=localStorage.getItem('token'),status=document.querySelector('#status'),out=document.querySelector('#chapters');if(!token){status.textContent='กรุณาเข้าสู่ระบบก่อน';return}fetch('/api/account',{headers:{Authorization:'Bearer '+token}}).then(r=>r.ok?r.json():Promise.reject()).then(async a=>{const user=a.user||{};if(!['vip','lifetime'].includes(String(user.tier||'').toLowerCase())){status.textContent='หนังสือชีวิตนี้ต้องใช้สมาชิก VIP ตลอดชีพ';return}const p=await fetch('/api/profile/birth',{headers:{Authorization:'Bearer '+token}}).then(r=>r.ok?r.json():{});const profile=p.profile||{},date=profile.birth_date;if(!date){status.textContent='กรุณาบันทึกข้อมูลเกิดใน onboarding ก่อน';return}const q=new URLSearchParams({birth_date:date,birth_time:profile.birth_time||'12:00',birth_place:profile.birth_place||profile.birth_province||''});for(const id of ['bazi','western_natal','ziwei','numerology','human_design','vedic','thai','thai_7_9','gene_keys','astrocartography']){const r=await fetch('/api/systems/'+id+'?'+q),d=await r.json();const card=document.createElement('section');card.className='panel';const h=document.createElement('h2');h.textContent=id;card.append(h);const pre=document.createElement('pre');pre.textContent=JSON.stringify(d.result||d.error,null,2);card.append(pre);out.append(card)}status.textContent='ผลคำนวณจาก endpoint ระบบแล้ว; การตีความ LEGO ยังไม่เปิดใช้งานสำหรับ corpus นี้'}).catch(()=>status.textContent='โหลดบัญชีหรือข้อมูลเกิดไม่สำเร็จ')})();</script></body></html>
