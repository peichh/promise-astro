<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • History</title><script src="https://cdn.tailwindcss.com"></script><body class="min-h-screen bg-[#09090b] text-stone-100"><header class="border-b border-amber-100/10 p-5"><a href="/dashboard.html" class="rounded-full border border-stone-700 px-4 py-2 text-sm">← ย้อนกลับ</a></header><main class="mx-auto max-w-4xl p-6 md:p-12"><p class="text-xs tracking-widest text-amber-200">YOUR JOURNAL</p><h1 class="mt-3 text-3xl">ประวัติการทำนาย</h1><div id="list" class="mt-6 space-y-4 text-stone-400">กำลังโหลด…</div></main><script>const t=localStorage.getItem('token');if(!t)location.href='/login.html';else fetch('/api/readings/history',{headers:{Authorization:'Bearer '+t}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);const a=d.readings||[];document.querySelector('#list').innerHTML=a.length?a.map(x=>`<article class="rounded-2xl border border-white/10 bg-[#141416] p-5"><div class="text-amber-200">${x.type} · ${new Date(Number(x.created_at)).toLocaleString('th-TH')}</div><p class="mt-2">${x.question||'คำอ่านทั่วไป'}</p><p class="mt-3 whitespace-pre-wrap leading-7 text-stone-300">${x.result_text}</p></article>`).join(''):'ยังไม่มีรายการคำทำนาย'}).catch(e=>document.querySelector('#list').textContent=e.message)</script></body></html>
