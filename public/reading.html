<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • Reading</title><script src="https://cdn.tailwindcss.com"></script><body class="min-h-screen bg-[#09090b] text-stone-100"><header class="flex justify-between border-b border-amber-100/10 p-5"><a href="/dashboard.html" class="rounded-full border border-stone-700 px-4 py-2 text-sm">← ย้อนกลับ</a><a href="/history.html" class="text-sm text-amber-200">ประวัติ →</a></header><main class="mx-auto max-w-3xl p-6 md:p-12"><p class="text-xs tracking-widest text-amber-200">PERSONAL READING</p><h1 class="mt-3 text-3xl">เปิดดวงพยากรณ์</h1><div class="mt-6 rounded-2xl border border-white/10 bg-[#141416] p-6"><select id="type" class="w-full rounded-xl border border-stone-700 bg-black p-3"><option>งาน</option><option>ความรัก</option><option>การเงิน</option><option>สุขภาพ</option></select><textarea id="q" class="mt-3 w-full rounded-xl border border-stone-700 bg-black p-3" rows="3" placeholder="คำถามที่อยากสำรวจ"></textarea><button id="go" class="mt-3 rounded-xl bg-amber-200 px-5 py-3 font-semibold text-black">สร้างคำอ่าน</button><article id="result" class="mt-6 whitespace-pre-wrap leading-8 text-stone-200"></article></div></main><script>const t=localStorage.getItem('token');if(!t)location.href='/login.html';document.querySelector('#go').onclick=async()=>{const b=document.querySelector('#go'),o=document.querySelector('#result');b.disabled=true;o.textContent='กำลังอ่าน…';try{const r=await fetch('/api/readings/generate',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({type:document.querySelector('#type').value,question:document.querySelector('#q').value})});const raw=await r.text();let d;try{d=raw?JSON.parse(raw):{}}catch{throw Error(`เซิร์ฟเวอร์ตอบกลับไม่ใช่ JSON (HTTP ${r.status})`)}if(!r.ok)throw Error(`${d.error||'เกิดข้อผิดพลาด'} (HTTP ${r.status}${d.code?' · '+d.code:''})`);o.textContent=d.text||'สร้างคำอ่านสำเร็จ'}catch(e){o.textContent=e.message||'เกิดข้อผิดพลาด'}finally{b.disabled=false}}</script></body></html>
