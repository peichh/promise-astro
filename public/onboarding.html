<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งค่าดวงเกิด - PROMISE</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#09090b] p-6 text-stone-100"><main class="mx-auto mt-8 max-w-2xl rounded-3xl border border-amber-100/10 bg-[#141416] p-8"><a href="/dashboard.html" class="inline-flex rounded-full border border-stone-700 px-4 py-2 text-sm text-stone-300">← ย้อนกลับ</a><h1 class="mt-6 text-2xl text-amber-100">ข้อมูลดวงกำเนิด</h1><p class="mt-2 text-sm text-stone-400">ค้นหาตำบล อำเภอ จังหวัด หรือประเทศ แล้วเลือกผลลัพธ์เพื่อบันทึกพิกัด ข้อมูลอัตลักษณ์เป็นข้อมูลที่ไม่บังคับ</p><form id="form" class="mt-6 grid gap-4 sm:grid-cols-2"><label>วันเกิด<input name="birth_date" type="date" required class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"></label><label>เวลาเกิด<input name="birth_time" type="time" class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"></label><label class="sm:col-span-2">สถานที่เกิด<input id="place" autocomplete="off" placeholder="เช่น เชียงใหม่, Thailand" required class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"><input id="lat" type="hidden"><input id="lng" type="hidden"><input id="zone" type="hidden" value="Asia/Bangkok"><div id="results" class="mt-2 space-y-1"></div><small id="selected" class="text-amber-200"></small></label><label>เพศ / อัตลักษณ์<select name="gender_current" class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"><option value="">ไม่ระบุ</option><option value="หญิง">หญิง</option><option value="ชาย">ชาย</option><option value="นอนไบนารี">นอนไบนารี</option><option value="อื่นๆ">อื่นๆ</option></select></label><label>รสนิยมทางเพศ<select name="sexual_orientation" class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"><option value="">ไม่ระบุ</option><option value="หญิงรักหญิง">หญิงรักหญิง (Lesbian)</option><option value="ชายรักชาย">ชายรักชาย (Gay)</option><option value="รักสองเพศ">รักสองเพศ (Bisexual)</option><option value="รักทุกเพศ">รักทุกเพศ (Pansexual)</option><option value="เอเซ็กชวล">เอเซ็กชวล (Asexual)</option><option value="เควียร์">เควียร์ (Queer)</option><option value="ชอบเพศตรงข้าม">ชอบเพศตรงข้าม (Heterosexual)</option><option value="อื่นๆ">อื่นๆ</option></select></label><label class="sm:col-span-2">อัตลักษณ์เพิ่มเติม<select name="lgbtq_identity" class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"><option value="">ไม่ระบุ</option><option value="หญิงข้ามเพศ / สาวสอง">หญิงข้ามเพศ / สาวสอง (Trans woman)</option><option value="ชายข้ามเพศ">ชายข้ามเพศ (Trans man)</option><option value="นอนไบนารี">นอนไบนารี (Non-binary)</option><option value="เพศสภาพลื่นไหล">เพศสภาพลื่นไหล (Genderfluid)</option><option value="หญิง">หญิง (Cis woman)</option><option value="ชาย">ชาย (Cis man)</option><option value="อื่นๆ">อื่นๆ</option></select></label><p id="msg" class="text-sm sm:col-span-2" role="status"></p><button class="rounded-xl bg-amber-200 p-3 font-semibold text-black sm:col-span-2">บันทึกข้อมูลดวงกำเนิด</button></form></main><script>const f=document.querySelector('#form'),q=document.querySelector('#place'),out=document.querySelector('#results'),msg=document.querySelector('#msg'),token=localStorage.getItem('token');let timer,selectedCoords=null;function setField(name,value){const el=f.elements.namedItem(name);if(el)el.value=value??''}async function loadProfile(){if(!token){msg.textContent='กรุณาเข้าสู่ระบบเพื่อโหลดหรือบันทึกข้อมูล';return}try{const r=await fetch('/api/profile/birth',{headers:{Authorization:'Bearer '+token}});if(r.status===401){msg.textContent='กรุณาเข้าสู่ระบบอีกครั้ง';return}const d=await r.json();if(!r.ok)throw Error(d.error||'โหลดข้อมูลไม่สำเร็จ');const p=d.profile;if(!p){msg.textContent='ยังไม่มีข้อมูลดวงกำเนิดที่บันทึกไว้';return}setField('birth_date',p.birth_date);setField('birth_time',p.birth_time);setField('gender_current',p.gender_current);setField('sexual_orientation',p.sexual_orientation);setField('lgbtq_identity',p.lgbtq_identity);q.value=p.birth_place||p.birth_province||'';document.querySelector('#lat').value=p.lat??'';document.querySelector('#lng').value=p.lng??'';document.querySelector('#zone').value=p.timezone||'Asia/Bangkok';selectedCoords=p.lat!=null&&p.lng!=null?{lat:p.lat,lng:p.lng}:null;document.querySelector('#selected').textContent=selectedCoords?'เลือกสถานที่ที่บันทึกไว้แล้ว • พิกัดพร้อมใช้งาน':'';msg.textContent='โหลดข้อมูลเดิมแล้ว คุณสามารถแก้ไขและบันทึกทับข้อมูลเดิมได้'}catch(e){msg.textContent=e.message}}q.oninput=()=>{clearTimeout(timer);selectedCoords=null;document.querySelector('#lat').value='';document.querySelector('#lng').value='';document.querySelector('#selected').textContent='';if(q.value.trim().length<3){out.replaceChildren();return}timer=setTimeout(async()=>{try{const u=new URL('https://nominatim.openstreetmap.org/search');u.searchParams.set('format','jsonv2');u.searchParams.set('addressdetails','1');u.searchParams.set('limit','6');u.searchParams.set('q',q.value);const r=await fetch(u,{headers:{'Accept-Language':'th,en'}});const a=await r.json();out.replaceChildren();if(!a.length){out.textContent='ไม่พบสถานที่';return}a.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='block w-full rounded-lg border border-stone-800 p-3 text-left text-sm hover:border-amber-200';b.textContent=x.display_name;b.onclick=()=>{q.value=x.display_name;document.querySelector('#lat').value=x.lat;document.querySelector('#lng').value=x.lon;selectedCoords={lat:x.lat,lng:x.lon};document.querySelector('#selected').textContent='เลือกแล้ว • พิกัดได้รับการระบุตำแหน่ง';out.replaceChildren()};out.append(b)})}catch{out.textContent='ค้นหาสถานที่ไม่สำเร็จ ลองอีกครั้ง'}},400)};f.onsubmit=async e=>{e.preventDefault();if(!token){msg.textContent='กรุณาเข้าสู่ระบบก่อน';return}if(!document.querySelector('#lat').value||!document.querySelector('#lng').value){msg.textContent='กรุณาค้นหาและเลือกสถานที่จากรายการ';return}const button=f.querySelector('button[type="submit"],button:not([type])');button.disabled=true;try{const r=await fetch('/api/profile/set',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({birth_date:f.elements.birth_date.value,birth_time:f.elements.birth_time.value,birth_place:q.value,birth_province:q.value,lat:+document.querySelector('#lat').value,lng:+document.querySelector('#lng').value,timezone:document.querySelector('#zone').value,gender_current:f.elements.gender_current.value||null,sexual_orientation:f.elements.sexual_orientation.value||null,lgbtq_identity:f.elements.lgbtq_identity.value||null})});const d=await r.json();if(!r.ok)throw Error(d.error||'บันทึกไม่สำเร็จ');msg.textContent='บันทึกเรียบร้อย';location.href='/natal.html'}catch(err){msg.textContent=err.message}finally{button.disabled=false}};loadProfile();</script></body></html>
