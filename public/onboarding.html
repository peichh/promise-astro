<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งค่าดวงเกิด - PROMISE</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#09090b] p-6 text-stone-100"><main class="mx-auto mt-8 max-w-2xl rounded-3xl border border-amber-100/10 bg-[#141416] p-8"><a href="/dashboard.html" class="inline-flex rounded-full border border-stone-700 px-4 py-2 text-sm text-stone-300">← ย้อนกลับ</a><h1 class="mt-6 text-2xl text-amber-100">ข้อมูลดวงกำเนิด</h1><p class="mt-2 text-sm text-stone-400">ค้นหาตำบล อำเภอ จังหวัด หรือประเทศ แล้วเลือกผลลัพธ์เพื่อบันทึกพิกัด</p><form id="form" class="mt-6 grid gap-4 sm:grid-cols-2"><label>วันเกิด<input name="birth_date" type="date" required class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"></label><label>เวลาเกิด<input name="birth_time" type="time" class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"></label><label class="sm:col-span-2">สถานที่เกิด<input id="place" autocomplete="off" placeholder="เช่น เชียงใหม่, Thailand" required class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"><input id="lat" type="hidden"><input id="lng" type="hidden"><input id="zone" type="hidden" value="Asia/Bangkok"><div id="results" class="mt-2 space-y-1"></div><small id="selected" class="text-amber-200"></small></label><label>เพศ / อัตลักษณ์<select name="gender_current" class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"><option value="">ไม่ประสงค์ระบุ</option><option>หญิง</option><option>ชาย</option><option>นอนไบนารี</option></select></label><label>รสนิยมทางเพศ<input name="sexual_orientation" class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"></label><label class="sm:col-span-2">อัตลักษณ์เพิ่มเติม<input name="lgbtq_identity" class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3"></label><p id="msg" class="text-sm sm:col-span-2" role="status"></p><button class="rounded-xl bg-amber-200 p-3 font-semibold text-black sm:col-span-2">บันทึกข้อมูลดวงกำเนิด</button></form></main><script>const f=document.querySelector('#form'),q=document.querySelector('#place'),out=document.querySelector('#results'),msg=document.querySelector('#msg');let timer; q.oninput=()=>{clearTimeout(timer);document.querySelector('#lat').value='';document.querySelector('#lng').value='';document.querySelector('#selected').textContent='';if(q.value.trim().length<3){out.innerHTML='';return}timer=setTimeout(async()=>{try{const u=new URL('https://nominatim.openstreetmap.org/search');u.searchParams.set('format','jsonv2');u.searchParams.set('addressdetails','1');u.searchParams.set('limit','6');u.searchParams.set('q',q.value);const r=await fetch(u,{headers:{'Accept-Language':'th,en'}});const a=await r.json();out.innerHTML=a.map((x,i)=>`<button type="button" data-i="${i}" class="block w-full rounded-lg border border-stone-800 p-3 text-left text-sm hover:border-amber-200">${x.display_name}</button>`).join('')||'<p class="text-sm text-stone-500">ไม่พบสถานที่</p>';out.querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=a[+b.dataset.i];q.value=x.display_name;document.querySelector('#lat').value=x.lat;document.querySelector('#lng').value=x.lon;document.querySelector('#selected').textContent='เลือกแล้ว • พิกัดได้รับการระบุตำแหน่ง';out.innerHTML='';});}catch{out.innerHTML='<p class="text-sm text-red-300">ค้นหาสถานที่ไม่สำเร็จ ลองอีกครั้ง</p>'}},400)};f.onsubmit=async e=>{e.preventDefault();const token=localStorage.getItem('token');if(!token){msg.textContent='กรุณาเข้าสู่ระบบก่อน';return}if(!document.querySelector('#lat').value){msg.textContent='กรุณาค้นหาและเลือกสถานที่จากรายการ';return}try{const r=await fetch('/api/profile/set',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({birth_date:f.birth_date.value,birth_time:f.birth_time.value,birth_place:q.value,birth_province:q.value,lat:+document.querySelector('#lat').value,lng:+document.querySelector('#lng').value,timezone:document.querySelector('#zone').value,gender_current:f.gender_current.value,sexual_orientation:f.sexual_orientation.value,lgbtq_identity:f.lgbtq_identity.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'บันทึกไม่สำเร็จ');msg.textContent='บันทึกเรียบร้อย';location.href='/natal.html'}catch(err){msg.textContent=err.message}};</script></body></html>
