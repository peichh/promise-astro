<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0c10"><title>เข้าสู่ระบบ • PROMISE</title><link rel="stylesheet" href="/css/promise.css"><style>.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,.1),transparent 55%),var(--bg)}.auth-card{width:min(100%,480px);padding:clamp(24px,5vw,42px);border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#161822,#111218);box-shadow:0 24px 80px #0008}.auth-brand{display:block;text-align:center;color:var(--gold2);font:600 16px Georgia,serif;letter-spacing:.2em;text-decoration:none}.auth-card h1{text-align:center;font-size:30px;margin:24px 0 6px}.auth-lede{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#0b0c10;padding:4px;border:1px solid #292a32;border-radius:12px;margin:20px 0}.auth-tabs a{text-align:center;text-decoration:none;padding:10px;border-radius:9px;color:var(--muted);font-size:14px}.auth-tabs a.active{background:#25231b;color:#f4d777;border:1px solid var(--line)}.auth-form label{display:block;color:#d6d3ca;font-size:13px;margin:14px 0 7px}.auth-form input{width:100%;padding:13px 14px;border:1px solid #383943;border-radius:10px;background:#0b0c10;color:#f4f1e8;font:inherit}.auth-form input:focus{outline:1px solid var(--gold);border-color:var(--gold)}.auth-form button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:999px;background:var(--gold);color:#111;font:600 15px 'IBM Plex Sans Thai',sans-serif;cursor:pointer}.auth-form button:disabled{opacity:.6;cursor:wait}.auth-msg{min-height:24px;margin-top:14px;text-align:center;font-size:13px;color:#e6c968}.auth-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}.auth-foot a{color:var(--gold2)}.home-link{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:18px;text-decoration:none}</style></head><body><main class="auth-wrap"><section class="auth-card"><a class="auth-brand" href="/">PROMISE ✨</a><h1>ยินดีต้อนรับกลับ</h1><p class="auth-lede">เข้าสู่พื้นที่ส่วนตัวของคุณ</p><nav class="auth-tabs"><a class="active" href="/login.html">เข้าสู่ระบบ</a><a href="/register.html">สมัครสมาชิก</a></nav><form id="loginForm" class="auth-form"><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">รหัสผ่าน</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">เข้าสู่ระบบ</button><p id="message" class="auth-msg" role="status" aria-live="polite"></p></form><p class="auth-foot">ยังไม่มีบัญชี? <a href="/register.html">สมัครสมาชิก</a></p><a class="home-link" href="/">กลับสู่หน้าแรก</a></section></main><script>(()=>{const form=document.querySelector('#loginForm'),button=document.querySelector('#submit'),message=document.querySelector('#message');const next=new URLSearchParams(location.search).get('next');const safeNext=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/dashboard.html';form.addEventListener('submit',async ev=>{ev.preventDefault();button.disabled=true;message.textContent='กำลังตรวจสอบบัญชี…';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:form.elements.email.value.trim(),password:form.elements.password.value})});const raw=await response.text();let data;try{data=raw?JSON.parse(raw):{}}catch{throw Error(`เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (HTTP ${response.status})`)}if(!response.ok)throw Error(data.error||`เข้าสู่ระบบไม่สำเร็จ (HTTP ${response.status})`);if(!data.token)throw Error('เข้าสู่ระบบไม่สำเร็จ: ไม่พบ session token');localStorage.setItem('token',data.token);if(data.user)localStorage.setItem('user',JSON.stringify(data.user));location.href=safeNext}catch(err){message.textContent=err.message||'เกิดข้อผิดพลาด กรุณาลองใหม่';button.disabled=false}})})();</script></body></html>
