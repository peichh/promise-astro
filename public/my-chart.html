<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • ผลดวงรวม</title><link rel="stylesheet" href="/css/promise.css"><style>.chart-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card p{line-height:1.9}</style></head><body><header class="site-head"><a class="brand" href="/">PROMISE ✨</a><button class="menu-toggle">เมนู</button><nav class="site-nav"><a href="/">หน้าแรก</a><a href="/systems/">ศาสตร์ทั้งหมด</a><a href="/tools/">เครื่องมือ</a><a href="/my-chart.html">ดวงของฉัน</a><a href="/compare/">เปรียบเทียบดวง</a><a href="/quiz/">ค้นหาศาสตร์</a><a href="/blog/">บทความ</a></nav></header><main class="wrap"><p class="eyebrow">PERSONAL CHART</p><h1>ผลดวงรวม</h1><p class="intro" id="state">กำลังตรวจสอบข้อมูลดวง…</p><section id="chart" class="chart-cards"></section><h2 style="margin-top:42px">Letters from the Stars</h2><section id="chapters" class="chart-cards"></section><p class="note">บทอ่านเป็นข้อความสะท้อนใจที่สร้างจาก corpus; ไม่ใช่คำทำนายหรือคำแนะนำด้านสุขภาพ การเงิน หรือกฎหมาย</p><a class="primary" href="/book.html">เปิด Book of Life</a></main><script src="/js/promise-nav.js"></script><script src="/js/reader-engine.js"></script><script>(()=>{const t=localStorage.getItem('token'),e=id=>document.getElementById(id);if(!t){e('state').textContent='กรุณาเข้าสู่ระบบเพื่อดูข้อมูลของคุณ';return}Promise.all([fetch('/api/account',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()),fetch('/api/astrology/chart',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json())]).then(([a,d])=>{const u=a.user||{};if(d.error){e('state').textContent=d.error;return}if(!d.profile){e('state').textContent='ยังไม่มีข้อมูลเกิดที่บันทึกไว้';return}e('state').textContent='ข้อมูลเกิดและผลคำนวณที่มีในบัญชีนี้';const p=d.profile;e('chart').innerHTML=`<article class="card"><h2>วันและเวลาเกิด</h2><p>${p.birth_date||'—'} · ${p.birth_time||'ไม่ระบุเวลา'}</p></article><article class="card"><h2>สถานที่และพิกัด</h2><p>${p.birth_place||p.birth_province||'—'} · ${p.lat??'—'}, ${p.lng??'—'}</p></article>${d.chart?['ascendant','sun','moon'].map(k=>`<article class="card"><h2>${k==='ascendant'?'ลัคนา':k==='sun'?'อาทิตย์':'จันทร์'}</h2><p>${d.chart[k].sign} · ${d.chart[k].degree}°</p></article>`).join(''):''}`;const seed=[p.birth_date,p.birth_time,p.lat,p.lng].join('|');const chapters=window.PROMISE_READER.build(seed,{name:u.display_name||'',pronoun_th:'คุณ'});e('chapters').innerHTML=chapters.map(c=>`<article class="card"><p class="eyebrow">${c.category.toUpperCase()}</p><p>${c.text}</p></article>`).join('')}).catch(()=>e('state').textContent='โหลดข้อมูลไม่สำเร็จ')})();</script></body></html>
