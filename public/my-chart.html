<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • Celestial Chart</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Noto+Serif+Thai:wght@300;400;600&display=swap" rel="stylesheet"><style>:root{color-scheme:dark;--gold:#d8b85a;--line:#d8b85a40;--muted:#aaa7a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#332919,#0a0b10 62%);color:#f1eee7;font:15px 'IBM Plex Sans Thai',sans-serif}header{border-bottom:1px solid #ffffff16;padding:20px max(calc((100vw - 1100px)/2),22px);display:flex;justify-content:space-between}a{color:#ead283;text-decoration:none}main{max-width:1100px;margin:auto;padding:42px 22px 80px}.eyebrow{color:#e5c158;letter-spacing:.22em;font-size:11px}.hero{margin:15px 0 28px}.hero h1{font:300 clamp(32px,5vw,48px) 'Noto Serif Thai',serif;margin:0}.muted{color:var(--muted);line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:1px solid var(--line);border-radius:999px;padding:10px 16px;background:#15151b;color:#e5d8ad;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#191a21dd,#101116ee);padding:23px;backdrop-filter:blur(12px);box-shadow:0 12px 35px #0005}.card h2{font:400 21px 'Noto Serif Thai',serif;color:#f0d987;margin:0 0 8px}.summary{color:#c4c0b8;font-size:13px;line-height:1.8}.placements{display:grid;gap:9px;margin-top:16px}.placement{display:flex;justify-content:space-between;gap:12px;padding:10px;border-top:1px solid #ffffff12}.placement span:first-child{color:#aaa}.placement span:last-child{text-align:right;color:#f2e7c4}.insight{margin-top:14px;border-left:2px solid var(--gold);padding:5px 0 5px 12px;color:#d5cebc;line-height:1.8}.constellation{height:150px;position:relative;margin:8px 0 15px;border-radius:16px;background:radial-gradient(ellipse at center,#41382055,transparent 70%)}.constellation:before,.constellation:after{content:'✦   ·      ✧      ·   ✦';position:absolute;top:25px;left:12%;color:#e8ce7a;letter-spacing:22px}.constellation:after{top:90px;left:32%;font-size:12px}.status{color:#e7d590}.watermark{position:fixed;right:14px;bottom:10px;color:#ffffff55;font-size:10px}@media(max-width:600px){main{padding-top:28px}}</style></head><body><header><a href="/dashboard.html">PROMISE ✦</a><a href="/account.html">บัญชี</a></header><main><p class="eyebrow">YOUR CELESTIAL BLUEPRINT</p><section class="hero"><h1>ผังดวงกำเนิดของฉัน</h1><p id="status" class="muted">กำลังอ่านแผนที่ท้องฟ้าของคุณ…</p><div class="actions"><a class="btn" href="/onboarding.html">แก้ไขข้อมูลเกิด</a><a class="btn" href="/book-of-life.html">เปิด Book of Life</a></div></section><div class="constellation"></div><section id="results" class="grid"></section></main><div id="watermark" class="watermark"></div><script>(()=>{const token=localStorage.getItem('token'),status=document.querySelector('#status'),out=document.querySelector('#results'),labels={western_natal:'โหราศาสตร์ตะวันตก',bazi:'โป๊ยหยี่สี่เถียว · BaZi',ziwei:'紫微斗數 · Zi Wei',numerology:'เลขศาสตร์',human_design:'Human Design',thai_7_9:'เลข 7 ตัว 9 ฐาน',thai:'สุริยยาตร์ไทย',vedic:'ภารตะ · Vedic',gene_keys:'Gene Keys',astrocartography:'Astrocartography'};if(!token){status.textContent='กรุณาเข้าสู่ระบบเพื่อดูผังดวง';return}const pretty=k=>({sun_long:'ตำแหน่งอาทิตย์',moon_long:'ตำแหน่งจันทร์',asc:'ลัคนา',moon_phase:'เฟสดวงจันทร์',lat:'ละติจูดเกิด',lng:'ลองจิจูดเกิด'})[k]||k.replaceAll('_',' ').replace(/\b\w/g,x=>x.toUpperCase());const sign=d=>{const signs=['เมษ','พฤษภ','เมถุน','กรกฎ','สิงห์','กันย์','ตุลย์','พิจิก','ธนู','มกร','กุมภ์','มีน'];return signs[Math.floor((((Number(d)%360)+360)%360)/30)]};fetch('/api/account',{headers:{Authorization:'Bearer '+token}}).then(async r=>{const a=await r.json();if(!r.ok)throw Error(a.error||'โหลดบัญชีไม่ได้');const u=a.user||{};document.querySelector('#watermark').textContent=(u.display_name||u.email||'PROMISE')+' · '+new Date().toLocaleString('th-TH');return fetch('/api/profile/charts',{headers:{Authorization:'Bearer '+token}})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'โหลดผังดวงไม่สำเร็จ');for(const [id,val] of Object.entries(d.results||{})){if(!val||typeof val!=='object'||val.error)continue;const c=document.createElement('article');c.className='card';const h=document.createElement('h2');h.textContent=labels[id]||id;c.append(h);const summary=document.createElement('p');summary.className='summary';summary.textContent=val.method||'มุมมองหนึ่งของแผนที่ดวงกำเนิด · ใช้เพื่อการสำรวจตนเอง';c.append(summary);const placements=document.createElement('div');placements.className='placements';let count=0;for(const [k,v] of Object.entries(val)){if(['system','method'].includes(k)||v==null||typeof v==='object')continue;const row=document.createElement('div');row.className='placement';const left=document.createElement('span');left.textContent=pretty(k);const right=document.createElement('span');right.textContent=(k==='sun_long'||k==='moon_long'||k==='asc')?`${sign(v)} · ${Number(v).toFixed(1)}°`:typeof v==='number'?Number(v).toFixed(2):String(v);row.append(left,right);placements.append(row);count++}if(count)c.append(placements);const insight=document.createElement('p');insight.className='insight';if(id==='western_natal'&&val.sun_long!=null){insight.textContent=`อาทิตย์อยู่ราศี${sign(val.sun_long)} · พิจารณาว่าคุณเปล่งประกายได้ดีที่สุดเมื่อได้ใช้จุดแข็งอย่างเป็นธรรมชาติ`}else if(id==='western_natal'&&val.moon_long!=null){insight.textContent=`จันทร์อยู่ราศี${sign(val.moon_long)} · สังเกตสิ่งที่ช่วยให้คุณรู้สึกปลอดภัยและกลับมาสมดุล`}else insight.textContent='ตัวเลขและสัญลักษณ์เหล่านี้เป็นภาษาของระบบดวง ใช้เป็นจุดเริ่มต้นในการใคร่ครวญ ไม่ใช่ข้อสรุปตายตัว';c.append(insight);out.append(c)}status.textContent='แผนที่ดวงกำเนิดส่วนตัว · '+Object.keys(d.results||{}).length+' ระบบ'}).catch(e=>status.textContent=e.message)})();</script></body></html>
