<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • ผลดวงรวม</title><link rel="stylesheet" href="/css/promise.css"></head><body><header class="site-head"><a class="brand" href="/">PROMISE ✨</a><button class="menu-toggle">เมนู</button><nav class="site-nav"><a href="/">หน้าแรก</a><a href="/systems/">ศาสตร์ทั้งหมด</a><a href="/tools/">เครื่องมือ</a><a href="/my-chart.html">ดวงของฉัน</a><a href="/compare/">เปรียบเทียบดวง</a><a href="/quiz/">ค้นหาศาสตร์</a><a href="/blog/">บทความ</a></nav></header><main class="wrap"><p class="eyebrow">PERSONAL CHART</p><h1>ผลดวงรวม</h1><p class="intro" id="state">กำลังตรวจสอบบัญชีและข้อมูลดวง</p><section id="chart" class="cards"></section><p class="note">ผลลัพธ์จะแสดงจากข้อมูลที่คำนวณได้จริงเท่านั้น</p></main><script src="/js/promise-nav.js"></script><script>(()=>{const id=new URLSearchParams(location.search).get('id');const t=localStorage.getItem('token');if(!t){document.querySelector('#state').textContent='กรุณาเข้าสู่ระบบเพื่อดูผลดวงของคุณ';return}if(id){document.querySelector('#state').textContent='ไม่สามารถเปิดข้อมูลของบุคคลอื่นจาก ID สาธารณะได้ กรุณาเข้าสู่ระบบบัญชีเจ้าของข้อมูล';return}fetch('/api/astrology/chart',{headers:{Authorization:'Bearer '+t}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'ไม่สามารถโหลดดวงได้');if(!d.profile){document.querySelector('#state').textContent='ยังไม่มีข้อมูลเกิดที่บันทึกไว้';return}document.querySelector('#state').textContent='ข้อมูลเกิดที่ผูกกับบัญชีนี้';document.querySelector('#chart').innerHTML=`<article class="card"><h2>วันและเวลาเกิด</h2><p>${d.profile.birth_date||'—'} · ${d.profile.birth_time||'ไม่ระบุเวลา'}</p></article><article class="card"><h2>สถานที่และพิกัด</h2><p>${d.profile.birth_place||d.profile.birth_province||'—'} · ${d.profile.lat??'—'}, ${d.profile.lng??'—'}</p></article>${d.chart?['ascendant','sun','moon'].map(k=>`<article class="card"><h2>${k}</h2><p>${d.chart[k].sign} · ${d.chart[k].degree}°</p></article>`).join(''):''}`}).catch(e=>document.querySelector('#state').textContent=e.message)})();</script></body></html>
