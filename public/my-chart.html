<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • My chart</title><link rel="stylesheet" href="/css/promise.css"><style>main{max-width:900px;margin:45px auto;padding:20px}.panel{margin:20px 0;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:grid;gap:8px}input,button{padding:11px;border-radius:8px;border:1px solid var(--line);background:#111218;color:#eee}button{background:#d4af37;color:#111;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><p class="eyebrow">YOUR CHART</p><h1>ดวงของฉัน</h1><p id="status" role="status">กำลังโหลดข้อมูลเกิด…</p><div class="panel"><div class="grid"><label>วันเกิด<input id="date" type="date" required></label><label>เวลาเกิด<input id="time" type="time" value="12:00"></label><label>สถานที่เกิด<input id="place"></label></div><button id="go">คำนวณ 14 ศาสตร์</button></div><div id="results"></div></main><script>(()=>{const token=localStorage.getItem('token'),status=document.querySelector('#status');if(!token){status.textContent='กรุณาเข้าสู่ระบบก่อน';return}fetch('/api/profile/birth',{headers:{Authorization:'Bearer '+token}}).then(r=>r.ok?r.json():null).then(d=>{const p=d&&d.profile;if(p){document.querySelector('#date').value=p.birth_date||'';document.querySelector('#time').value=p.birth_time||'12:00';document.querySelector('#place').value=p.birth_place||p.birth_province||'';status.textContent='ข้อมูลเกิดโหลดแล้ว กรุณากดคำนวณ'}}).catch(()=>status.textContent='กรอกข้อมูลเกิดเพื่อเริ่มคำนวณ');document.querySelector('#go').onclick=async()=>{const date=document.querySelector('#date').value;if(!date){status.textContent='กรุณากรอกวันเกิด';return}const q=new URLSearchParams({birth_date:date,birth_time:document.querySelector('#time').value||'12:00',birth_place:document.querySelector('#place').value});const wrap=document.querySelector('#results');wrap.replaceChildren();status.textContent='กำลังคำนวณ…';for(const id of ['bazi','western_natal','ziwei','numerology','human_design','vedic','thai','thai_7_9','gene_keys','astrocartography']){const card=document.createElement('section');card.className='panel';card.innerHTML='<h2></h2><pre></pre>';card.querySelector('h2').textContent=id;wrap.append(card);try{const r=await fetch('/api/systems/'+id+'?'+q),d=await r.json();card.querySelector('pre').textContent=JSON.stringify(d.result||d.error,null,2)}catch(e){card.querySelector('pre').textContent='โหลดไม่สำเร็จ'}}status.textContent='คำนวณเสร็จ (ระบบที่ยังไม่มี calculator แสดงสถานะจาก API)'}})();</script></body></html>
