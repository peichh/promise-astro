<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • My Chart</title><link rel="stylesheet" href="/css/promise.css"><style>main{max-width:1000px;margin:40px auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.card h2{color:#e5c158}.muted{color:#aaa;line-height:1.8}.watermark{position:fixed;bottom:12px;right:14px;color:#ffffff55;font-size:10px;pointer-events:none}.pill{display:inline-block;border:1px solid #d4af3755;border-radius:20px;padding:5px 10px;color:#e5c158;margin:4px}</style></head><body><main><p class="eyebrow">YOUR NATAL FOUNDATION</p><h1>ผังดวงกำเนิดของฉัน</h1><p id="status" class="muted">กำลังคำนวณจากข้อมูลโปรไฟล์…</p><div id="results" class="grid"></div></main><div id="watermark" class="watermark"></div><script>(()=>{const t=localStorage.getItem('token'),status=document.querySelector('#status'),out=document.querySelector('#results');if(!t){status.textContent='กรุณาเข้าสู่ระบบ';return}const label={bazi:'โป๊ยหยี่สี่เถียว · BaZi',western_natal:'โหราศาสตร์ตะวันตก',ziwei:'紫微斗數 · Zi Wei',numerology:'เลขศาสตร์',human_design:'Human Design',thai_7_9:'เลข 7 ตัว 9 ฐาน',thai:'สุริยยาตร์ไทย',vedic:'ภารตะ · Vedic',gene_keys:'Gene Keys',astrocartography:'Astrocartography'};fetch('/api/account',{headers:{Authorization:'Bearer '+t}}).then(r=>r.json()).then(a=>{const u=a.user||{};document.querySelector('#watermark').textContent=(u.display_name||u.email||'PROMISE')+' · '+new Date().toLocaleString('th-TH');return fetch('/api/profile/charts',{headers:{Authorization:'Bearer '+t}})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'โหลดดวงไม่สำเร็จ');for(const [id,val] of Object.entries(d.results||{})){const c=document.createElement('article');c.className='card';const h=document.createElement('h2');h.textContent=label[id]||id;c.append(h);const desc=document.createElement('p');desc.className='muted';desc.textContent=val?.method||'มุมมองดวงกำเนิดสำหรับการสำรวจตนเอง';c.append(desc);for(const [k,v] of Object.entries(val||{})){if(k==='system'||k==='method'||typeof v==='object')continue;const p=document.createElement('span');p.className='pill';p.textContent=k.replaceAll('_',' ')+': '+String(v);c.append(p)}out.append(c)}status.textContent='คำนวณจากข้อมูลเกิดที่บันทึกไว้ · '+Object.keys(d.results||{}).length+' ระบบ'}).catch(e=>status.textContent=e.message)})();</script></body></html>
