<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • Account</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#09090b] text-stone-100"><header class="border-b border-amber-100/10"><div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5"><a href="/dashboard.html" class="text-xs tracking-[.28em] text-amber-200">PROMISE ✨</a><a href="/dashboard.html" class="rounded-full border border-white/10 px-4 py-2 text-sm text-stone-300">← กลับสู่แดชบอร์ด</a></div></header><main class="mx-auto max-w-6xl px-6 py-10 md:py-16"><p class="text-[11px] tracking-[.3em] text-amber-200">YOUR MEMBERSHIP</p><h1 class="mt-3 font-serif text-4xl md:text-5xl">บัญชีและสมาชิกภาพ</h1><section class="mt-10 grid gap-5 lg:grid-cols-2"><article class="rounded-3xl border border-amber-200/25 bg-[#111218] p-8"><p class="text-xs tracking-widest text-amber-200">CURRENT MEMBERSHIP</p><h2 id="tier" class="mt-5 font-serif text-3xl text-amber-100">กำลังโหลด…</h2><p id="tierStatus" class="mt-3 text-sm text-stone-400"></p><p id="feature" class="mt-5 text-sm text-stone-300"></p><a href="/payment.html" class="mt-7 inline-block rounded-full bg-[#d4af37] px-5 py-3 text-sm font-semibold text-black">ดูแพ็กเกจ</a></article><article class="rounded-3xl border border-white/10 bg-[#111218] p-8"><p class="text-xs tracking-widest text-amber-200">ACCOUNT</p><p id="email" class="mt-4 break-all"></p><p id="role" class="mt-2 text-sm text-stone-400"></p><p id="joined" class="mt-2 text-sm text-stone-400"></p></article></section><section class="mt-6 rounded-3xl border border-amber-100/15 bg-[#111218] p-6 md:p-8"><h2 class="font-serif text-2xl">ชื่อที่แสดง</h2><form id="nameForm" class="mt-5 flex flex-col gap-3 sm:flex-row"><label class="sr-only" for="displayName">ชื่อที่แสดง</label><input id="displayName" maxlength="80" required class="min-w-0 flex-1 rounded-xl border border-white/10 bg-black/50 px-4 py-3 text-white" placeholder="ชื่อที่ต้องการให้แสดง"><button id="saveName" class="rounded-xl bg-[#d4af37] px-6 py-3 font-semibold text-black">บันทึกข้อมูล</button></form><p id="nameToast" class="mt-3 text-sm text-amber-200" role="status"></p></section><section class="mt-6 rounded-3xl border border-white/10 bg-[#111218] p-6"><button id="logout" class="rounded-full border border-white/15 px-5 py-3">ออกจากระบบ</button><p id="message" class="mt-3 text-sm text-stone-400"></p></section></main><script src="/js/promise-nav.js"></script><script>(()=>{const t=localStorage.getItem('token');if(!t){location.href='/login.html';return}const e=id=>document.getElementById(id),labels={free:'Free Explorer',basic:'Basic Star',premium:'PROMISE Member',pro:'PROMISE Member',lifetime:'VIP ตลอดชีพ (Book of Life)',vip:'VIP ตลอดชีพ (Book of Life)'};async function parse(r){const d=await r.json();if(!r.ok)throw Error(d.error||'เกิดข้อผิดพลาด');return d}fetch('/api/account',{headers:{Authorization:'Bearer '+t}}).then(parse).then(d=>{const u=d.user||{},tier=String(u.tier||'free').toLowerCase();e('tier').textContent=labels[tier]||tier;e('tier').classList.toggle('text-amber-100',tier==='lifetime'||tier==='vip');e('tierStatus').textContent=(tier==='lifetime'||tier==='vip')?'สมาชิกภาพสูงสุด · ไม่มีวันหมดอายุ':'สมาชิกภาพพร้อมใช้งาน';e('feature').textContent=(tier==='lifetime'||tier==='vip')?'สิทธิ์สมาชิกสูงสุด · VIP ตลอดชีพ':'สิทธิ์สมาชิกตามแพลน';e('email').textContent=u.email||'—';e('role').textContent=u.role==='admin'?'ผู้ดูแลระบบ':'สมาชิก';e('displayName').value=u.display_name||'';if(u.created_at)e('joined').textContent='สมาชิกตั้งแต่ '+new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'long',year:'numeric'}).format(new Date(u.created_at))}).catch(err=>{e('tier').textContent='โหลดข้อมูลไม่สำเร็จ';e('tierStatus').textContent=err.message});e('nameForm').onsubmit=async ev=>{ev.preventDefault();const b=e('saveName');b.disabled=true;try{const d=await parse(await fetch('/api/account',{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({display_name:e('displayName').value.trim()})}));e('displayName').value=d.display_name;e('nameToast').textContent='บันทึกชื่อสำเร็จ ✨'}catch(err){e('nameToast').textContent=err.message}finally{b.disabled=false}};e('logout').onclick=()=>{localStorage.removeItem('token');localStorage.removeItem('user');location.href='/login.html'}})();</script></body></html>
