<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • Account</title><script src="https://cdn.tailwindcss.com"></script><body class="min-h-screen bg-[#09090b] text-stone-100"><header class="border-b border-amber-100/10 p-5"><a href="/dashboard.html" class="rounded-full border border-stone-700 px-4 py-2 text-sm">← ย้อนกลับ</a></header><main class="mx-auto max-w-3xl p-6 md:p-12"><p class="text-xs tracking-widest text-amber-200">MEMBERSHIP & ACCOUNT</p><h1 class="mt-3 text-3xl">บัญชีและสมาชิกภาพ</h1><section class="mt-6 rounded-2xl border border-amber-100/15 bg-[#141416] p-6"><p class="text-sm text-stone-500">แพลนปัจจุบัน</p><h2 id="tier" class="mt-2 text-2xl text-amber-200">กำลังโหลด…</h2><p id="status" class="mt-2 text-stone-400"></p><a href="/payment.html" class="mt-4 inline-block rounded-full border border-amber-200/30 px-4 py-2 text-sm text-amber-200">ดูแพ็กเกจและอัปเกรด</a></section><form id="form" class="mt-6 space-y-4 rounded-2xl border border-white/10 bg-[#141416] p-6"><h2 class="text-lg">ข้อมูลบัญชี</h2><label class="block text-sm text-stone-400">ชื่อที่แสดง<input id="name" class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3 text-white"></label><label class="block text-sm text-stone-400">อีเมล<input id="email" disabled class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3 text-stone-500"></label><label class="block text-sm text-stone-400">ตั้งรหัสผ่านใหม่<input id="pw" type="password" minlength="8" class="mt-2 w-full rounded-xl border border-stone-700 bg-black p-3 text-white" placeholder="ยังไม่รองรับการเปลี่ยนรหัสผ่านในหน้านี้"></label><button class="rounded-xl bg-amber-200 px-5 py-3 font-semibold text-black">บันทึกชื่อ</button><p id="msg" class="text-sm text-stone-400"></p></form></main><script>const t=localStorage.getItem('token');if(!t)location.href='/login.html';else fetch('/api/account',{headers:{Authorization:'Bearer '+t}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);const u=d.user;document.querySelector('#name').value=u.display_name||'';document.querySelector('#email').value=u.email||'';const tier=u.tier||'free';document.querySelector('#tier').textContent=String(tier).toLowerCase()==='free'?'Free Explorer':tier;document.querySelector('#status').textContent=u.status||'สถานะบัญชีปกติ'}).catch(e=>{document.querySelector('#tier').textContent='โหลดบัญชีไม่สำเร็จ';document.querySelector('#status').textContent=e.message});document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const msg=document.querySelector('#msg');if(document.querySelector('#pw').value){msg.textContent='การเปลี่ยนรหัสผ่านยังไม่เปิดใช้งาน โปรดใช้ขั้นตอนรีเซ็ตรหัสผ่าน';return}try{const r=await fetch('/api/account',{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({display_name:document.querySelector('#name').value})});const d=await r.json();if(!r.ok)throw Error(d.error);msg.textContent='บันทึกชื่อเรียบร้อย'}catch(e){msg.textContent=e.message}}</script></body></html>
