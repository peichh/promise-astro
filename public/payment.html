<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ชำระเงิน PromptPay - PROMISE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/qrcodejs2@0.0.2/qrcode.js"></script>
</head>
<body class="bg-[#FFF8F0] min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-lg bg-white rounded-[32px] p-8 shadow-2xl border">
<h1 class="text-2xl font-bold">ชำระเงินด้วย PromptPay</h1>
<p class="text-sm opacity-60 mt-2">สแกน QR เพื่อจ่าย แล้วอัปโหลดสลิป ระบบจะผูกแพ็กเกจกับรหัสของคุณทันทีหลังแอดมินอนุมัติ</p>

<div class="mt-6 grid md:grid-cols-2 gap-6">
<div>
<label class="text-xs">เลือกแพ็กเกจ</label>
<select id="plan" class="w-full mt-2 border rounded-xl p-3"><option value="basic" data-amount="299">Basic - 299฿ / เดือน (อ่านดวง + ไพ่ 3 ใบ)</option><option value="premium" data-amount="599">Premium - 599฿ / เดือน (หนังสือชีวิต + กันก๊อป + MCP AI ในอนาคต)</option></select>
<button id="genQR" class="mt-4 w-full bg-black text-white py-3 rounded-xl">สร้าง QR PromptPay</button>
<div id="qrBox" class="mt-4 flex flex-col items-center"><div id="qrcode"></div><div id="qrInfo" class="mt-3 text-xs text-center opacity-60"></div></div>
</div>
<div>
<label class="text-xs">อัปโหลดสลิป (เก็บใน R2 Private: promise-slips)</label>
<input id="slip" type="file" accept="image/*" class="mt-2 w-full border rounded-xl p-3">
<button id="uploadSlip" class="mt-4 w-full bg-[#C9A86A] text-white py-3 rounded-xl">อัปโหลดสลิปเพื่อตรวจสอบ</button>
<div id="status" class="mt-4 text-sm"></div>
</div>
</div>

<div class="mt-6 text-[10px] opacity-40">Security: QR payload ไม่ได้ฝังข้อมูลดวง / สลิปเก็บใน R2 Private เท่านั้น / transaction_id ผูกกับ user_id กันปลอมสลิป</div>
</div>

<script>
let currentTx=null;
let currentUser=JSON.parse(localStorage.getItem('user')||'{}');
document.getElementById('genQR').addEventListener('click', async ()=>{
  const plan = document.getElementById('plan').value;
  const amount = document.getElementById('plan').selectedOptions[0].dataset.amount;
  const token = localStorage.getItem('token');
  const res = await fetch('/api/payment/create',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({user_id:currentUser.id||currentUser.uid, plan, amount})});
  const data = await res.json();
  currentTx=data.transaction_id;
  document.getElementById('qrBox').style.display='flex';
  document.getElementById('qrcode').innerHTML='';
  new QRCode(document.getElementById('qrcode'), {text: data.qr_payload, width:200, height:200});
  document.getElementById('qrInfo').innerText = `จำนวน ${data.amount}฿ | รหัส ${data.transaction_id.slice(0,8)} | หมดอายุ 15 นาที`;
});

document.getElementById('uploadSlip').addEventListener('click', async ()=>{
  if(!currentTx){ alert('สร้าง QR ก่อน'); return; }
  const file = document.getElementById('slip').files[0];
  if(!file){ alert('เลือกรูปสลิป'); return; }
  const fd = new FormData();
  fd.append('transaction_id', currentTx);
  fd.append('user_id', currentUser.id||currentUser.uid);
  fd.append('slip', file);
  const token = localStorage.getItem('token');
  const res = await fetch('/api/payment/verify',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});
  const data = await res.json();
  document.getElementById('status').innerText = data.ok ? 'อัปโหลดแล้ว รอแอดมินตรวจสอบ (ดูใน promise_transactions)' : data.error;
  if(data.ok) setTimeout(()=>location.href='/dashboard.html',1500);
});
</script>
</body></html>
