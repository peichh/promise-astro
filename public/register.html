<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>สมัครสมาชิก - PROMISE</title>
<style>body{margin:0;background:#fdf8ef;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;font-family:sans-serif}.card{background:white;border-radius:24px;padding:32px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.08);border:1px solid #f1e6d3}input{width:100%;padding:14px 18px;border-radius:12px;border:1px solid #e5e7eb;margin-top:14px;font-size:15px}button{width:100%;margin-top:20px;padding:14px;border-radius:12px;background:#111827;color:white;border:none;font-size:16px;cursor:pointer}.msg{margin-top:14px;font-size:13px}</style>
</head>
<body>
<div class="card">
<h1>สมัครสมาชิก</h1>
<p style="color:#6b7280;font-size:14px">สมัครด้วยอีเมลจริงเท่านั้น</p>
<form id="form" autocomplete="on">
<input id="email" name="email" type="email" placeholder="อีเมล" autocomplete="email" required>
<input id="password" name="password" type="password" placeholder="รหัสผ่าน 8 ตัวขึ้นไป" autocomplete="new-password" minlength="8" required>
<input id="display_name" name="display_name" type="text" placeholder="ชื่อเล่นที่อยากให้เราเรียก" autocomplete="name" required>
<button id="btn" type="submit">สมัครและไปตั้งค่าดวงเกิด →</button>
<div id="msg" class="msg" role="status" aria-live="polite"></div>
</form>
<div style="margin-top:16px;text-align:center;font-size:13px"><a href="/login.html">มีบัญชีแล้ว? เข้าสู่ระบบ</a></div>
</div>
<script>
const form=document.getElementById('form');const msg=document.getElementById('msg');const btn=document.getElementById('btn');
form.addEventListener('submit',async(e)=>{
 e.preventDefault();btn.disabled=true;msg.textContent='กำลังสมัคร...';msg.style.color='';
 try{
   const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:form.elements.email.value.trim(),password:form.elements.password.value,display_name:form.elements.display_name.value.trim()})});
   const raw=await res.text();let data={};try{data=raw?JSON.parse(raw):{};}catch{throw new Error(`เซิร์ฟเวอร์ตอบกลับไม่ใช่ JSON (HTTP ${res.status}): ${raw.slice(0,180)}`);}
   if(!res.ok)throw new Error(data.error==='email exists'?'อีเมลนี้สมัครแล้ว':data.error||`สมัครไม่ได้ (HTTP ${res.status})`);
   if(!data.token||!data.user)throw new Error('สมัครสำเร็จแต่เซิร์ฟเวอร์ไม่ส่งข้อมูลล็อกอินกลับมา');
   localStorage.setItem('token',data.token);localStorage.setItem('user',JSON.stringify(data.user));location.href='/onboarding.html';
 }catch(err){msg.textContent=err.message||'เกิดข้อผิดพลาด กรุณาลองใหม่';msg.style.color='#dc2626';console.error('Registration failed:',err);btn.disabled=false;}
});
</script>
</body>
</html>
