<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0c10"><title>สมัครสมาชิก • PROMISE</title><link rel="stylesheet" href="/css/promise.css"><style>.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(ellipse at 50% 0%,rgba(212,175,55,.1),transparent 55%),var(--bg)}.auth-card{width:min(100%,520px);padding:clamp(24px,5vw,42px);border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#161822,#111218);box-shadow:0 24px 80px #0008}.auth-brand{display:block;text-align:center;color:var(--gold2);font:600 16px Georgia,serif;letter-spacing:.2em;text-decoration:none}.auth-card h1{text-align:center;font-size:30px;margin:22px 0 6px}.auth-lede{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#0b0c10;padding:4px;border:1px solid #292a32;border-radius:12px;margin:20px 0}.auth-tabs a{text-align:center;text-decoration:none;padding:10px;border-radius:9px;color:var(--muted);font-size:14px}.auth-tabs a.active{background:#25231b;color:#f4d777;border:1px solid var(--line)}.auth-form label{display:block;color:#d6d3ca;font-size:13px;margin:12px 0 6px}.auth-form input,.auth-form select{width:100%;padding:12px 13px;border:1px solid #383943;border-radius:10px;background:#0b0c10;color:#f4f1e8;font:inherit}.auth-form input:focus,.auth-form select:focus{outline:1px solid var(--gold);border-color:var(--gold)}.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.auth-form button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:999px;background:var(--gold);color:#111;font:600 15px 'IBM Plex Sans Thai',sans-serif;cursor:pointer}.auth-form button:disabled{opacity:.6;cursor:wait}.auth-msg{min-height:24px;margin-top:13px;text-align:center;font-size:13px;color:#e6c968}.auth-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.auth-foot a{color:var(--gold2)}.home-link{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:16px;text-decoration:none}@media(max-width:500px){.auth-grid{grid-template-columns:1fr}}</style></head><body><main class="auth-wrap"><section class="auth-card"><a class="auth-brand" href="/">PROMISE ✨</a><h1>สร้างบัญชีของคุณ</h1><p class="auth-lede">เริ่มต้นพื้นที่ส่วนตัวของคุณกับ PROMISE</p><nav class="auth-tabs"><a href="/login.html">เข้าสู่ระบบ</a><a class="active" href="/register.html">สมัครสมาชิก</a></nav><form id="registerForm" class="auth-form"><label for="display_name">ชื่อที่อยากให้เราเรียก</label><input id="display_name" name="display_name" maxlength="80" autocomplete="name" required><div class="auth-grid"><div><label for="email">อีเมล</label><input id="email" name="email" type="email" autocomplete="email" required></div><div><label for="password">รหัสผ่าน (อย่างน้อย 8 ตัว)</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div></div><button id="submit" type="submit">สมัครสมาชิก</button><p id="message" class="auth-msg" role="status" aria-live="polite"></p></form><p class="auth-foot">มีบัญชีอยู่แล้ว? <a href="/login.html">เข้าสู่ระบบ</a></p><a class="home-link" href="/">กลับสู่หน้าแรก</a></section></main><script>(()=>{const form=document.querySelector('#registerForm'),button=document.querySelector('#submit'),message=document.querySelector('#message');form.addEventListener('submit',async ev=>{ev.preventDefault();button.disabled=true;message.textContent='กำลังสร้างบัญชี…';try{const response=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({display_name:form.elements.display_name.value.trim(),email:form.elements.email.value.trim(),password:form.elements.password.value})});const raw=await response.text();let data;try{data=raw?JSON.parse(raw):{}}catch{throw Error(`เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (HTTP ${response.status})`)}if(!response.ok)throw Error(data.error==='email exists'?'อีเมลนี้มีบัญชีแล้ว กรุณาเข้าสู่ระบบ':data.error||`สมัครไม่สำเร็จ (HTTP ${response.status})`);if(!data.token)throw Error('สร้างบัญชีแล้วแต่ไม่ได้รับ session token');localStorage.setItem('token',data.token);if(data.user)localStorage.setItem('user',JSON.stringify(data.user));location.href='/onboarding.html'}catch(err){message.textContent=err.message||'เกิดข้อผิดพลาด กรุณาลองใหม่';button.disabled=false}})})();</script></body></html>
