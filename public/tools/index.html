<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • Divination tools</title><link rel="stylesheet" href="/css/promise.css"><style>main{max-width:900px;margin:48px auto;padding:22px}.card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:22px;margin:14px 0}button{background:#d4af37;border:0;border-radius:999px;padding:12px 20px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#eee}.links{display:flex;gap:10px;flex-wrap:wrap}.links a{color:#e5c158}</style></head><body><main><p class="eyebrow">DIVINATION STUDIO</p><h1>เครื่องมือเสี่ยงทาย</h1><p>สุ่มไพ่และคำแนะนำทันที พร้อมดึงคลังความรู้ของแต่ละศาสตร์</p><section class="card"><h2>ตั้งคำถาม</h2><label>คำถาม (ไม่บังคับ) <input id="question" style="padding:10px;background:#111;color:white;border:1px solid #555;border-radius:8px"></label><div class="links"><button data-system="tarot">จั่ว Tarot</button><button data-system="iching">เสี่ยงทาย I Ching</button><button data-system="lenormand">จั่ว Lenormand</button></div></section><div id="status" role="status"></div><section id="result" class="card" hidden><h2 id="title"></h2><pre id="data"></pre><details><summary>คลังความรู้</summary><pre id="knowledge"></pre></details></section><div class="links"><a href="/systems/">14 ศาสตร์</a><a href="/my-chart.html">ผังดวงกำเนิด</a></div></main><script>const status=document.querySelector('#status'),card=document.querySelector('#result');document.querySelectorAll('[data-system]').forEach(b=>b.onclick=async()=>{status.textContent='กำลังเปิดไพ่…';b.disabled=true;try{const u=new URLSearchParams({seed:document.querySelector('#question').value||String(Date.now())});const r=await fetch('/api/tools/'+b.dataset.system+'?'+u),d=await r.json();if(!r.ok)throw Error(d.error||'เกิดข้อผิดพลาด');document.querySelector('#title').textContent=b.dataset.system==='iching'?'I Ching · กว้าแห่งคำแนะนำ':b.dataset.system==='tarot'?'Tarot · ไพ่สามตำแหน่ง':'Lenormand · ไพ่สามใบ';document.querySelector('#data').textContent=JSON.stringify(d.result,null,2);document.querySelector('#knowledge').textContent=JSON.stringify(d.knowledge,null,2);card.hidden=false;status.textContent='เรียบร้อย';}catch(e){status.textContent=e.message}finally{b.disabled=false}});</script></body></html>
