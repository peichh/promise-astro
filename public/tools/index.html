<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • Tools</title><link rel="stylesheet" href="/css/promise.css"><style>main{max-width:1000px;margin:40px auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}label{display:grid;gap:6px;margin:8px 0}input,select,button{padding:10px;background:#111;color:#eee;border:1px solid #555;border-radius:8px}button{background:#d4af37;color:#111;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}.result{margin-top:20px}</style></head><body><main><p class="eyebrow">DIVINATION STUDIO</p><h1>เครื่องมือ 14 ศาสตร์</h1><p>เลือกศาสตร์ กรอกข้อมูลที่จำเป็น หรือกดจั่วเพื่อรับผลพร้อมคลังความรู้</p><div class="grid" id="tools"></div><section class="card result"><p id="status" role="status"></p><h2 id="title"></h2><pre id="result"></pre><details><summary>คลังความรู้</summary><pre id="knowledge"></pre></details></section></main><script>const defs=[['bazi','BaZi'],['western_natal','Western Natal'],['ziwei','Zi Wei'],['numerology','Numerology'],['human_design','Human Design'],['thai_7_9','Thai 7/9'],['thai','Thai Suriyayart'],['vedic','Vedic'],['gene_keys','Gene Keys'],['astrocartography','Astrocartography'],['synastry','Synastry'],['tarot','Tarot'],['iching','I Ching'],['lenormand','Lenormand']];const root=document.querySelector('#tools');for(const [id,name] of defs){const c=document.createElement('article');c.className='card';c.innerHTML='<h2></h2><form><label>วันเกิด<input name="birth_date" type="date"></label><label>เวลา<input name="birth_time" type="time" value="12:00"></label><label>สถานที่<input name="birth_place"></label><label class="partner" hidden>คู่: วันเกิด<input name="b_birth_date" type="date"></label><label class="partner" hidden>คู่: เวลา<input name="b_birth_time" type="time" value="12:00"></label><label class="partner" hidden>คู่: สถานที่<input name="b_birth_place"></label><button>คำนวณ / จั่ว</button></form>';c.querySelector('h2').textContent=name;if(id==='synastry')c.querySelectorAll('.partner').forEach(x=>x.hidden=false);c.querySelector('form').onsubmit=async e=>{e.preventDefault();const q=new URLSearchParams(new FormData(e.currentTarget));if(['tarot','iching','lenormand'].includes(id))q.set('seed',String(Date.now()));const status=document.querySelector('#status');status.textContent='กำลังคำนวณ…';try{const r=await fetch('/api/systems/'+id+'?'+q),d=await r.json();if(!r.ok)throw Error(d.error||'ไม่สำเร็จ');document.querySelector('#title').textContent=name;document.querySelector('#result').textContent=JSON.stringify(d.result,null,2);document.querySelector('#knowledge').textContent=JSON.stringify(d.knowledge,null,2);status.textContent='คำนวณสำเร็จ'}catch(x){status.textContent=x.message}};root.append(c)}</script></body></html>
