<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • ค้นหาศาสตร์</title><link rel="stylesheet" href="/css/promise.css"></head><body><header class="site-head"><a class="brand" href="/">PROMISE ✨</a><button class="menu-toggle">เมนู</button><nav class="site-nav"><a href="/">หน้าแรก</a><a href="/systems/">ศาสตร์ทั้งหมด</a><a href="/tools/">เครื่องมือ</a><a href="/my-chart.html">ดวงของฉัน</a><a href="/compare/">เปรียบเทียบดวง</a><a href="/quiz/">ค้นหาศาสตร์</a><a href="/blog/">บทความ</a></nav></header><main class="wrap"><p class="eyebrow">FIND YOUR SYSTEM</p><h1>ค้นหาศาสตร์ที่เหมาะกับคุณ</h1><p class="intro">แบบสอบถามสั้นสามข้อจะช่วยจัดโครงแนะนำแนวทางศึกษา เมื่อมีเกณฑ์แนะนำที่ผ่านการทบทวนแล้ว</p><form id="quiz" class="form-card"><label for="q1">1. คุณอยากสำรวจเรื่องใด</label><select id="q1"><option value="">เลือกคำตอบ</option><option>บุคลิกภาพและแรงขับ</option><option>จังหวะเวลาและวัฏจักรชีวิต</option><option>ความสัมพันธ์</option></select><label for="q2">2. คุณสนใจวิธีการแบบใด</label><select id="q2"><option value="">เลือกคำตอบ</option><option>สัญลักษณ์และแผนที่ดาว</option><option>ปฏิทินและวัฏจักร</option><option>การสะท้อนตนเอง</option></select><label for="q3">3. ข้อมูลเวลาเกิดของคุณเป็นอย่างไร</label><select id="q3"><option value="">เลือกคำตอบ</option><option>ทราบเวลาเกิดค่อนข้างแน่นอน</option><option>ทราบโดยประมาณ</option><option>ไม่ทราบเวลาเกิด</option></select><button>ตรวจความครบถ้วน</button><div id="result" class="result" aria-live="polite">ยังไม่มีระบบแนะนำศาสตร์เชื่อมต่อ</div></form></main><script src="/js/promise-nav.js"></script><script>document.querySelector('#quiz').onsubmit=e=>{e.preventDefault();const vals=[...e.currentTarget.querySelectorAll('select')].map(x=>x.value);document.querySelector('#result').textContent=vals.every(Boolean)?'บันทึกคำตอบครบแล้ว แต่ระบบแนะนำศาสตร์ยังไม่เชื่อมต่อ':'กรุณาตอบคำถามทั้งสามข้อ'};</script></body></html>
