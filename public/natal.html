<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • Natal Chart</title><script src="https://cdn.tailwindcss.com"></script><body class="min-h-screen bg-[#09090b] text-stone-100"><header class="flex items-center justify-between border-b border-amber-100/10 p-5"><a href="/dashboard.html" class="rounded-full border border-stone-700 px-4 py-2 text-sm">← ย้อนกลับ</a><span class="tracking-[.3em] text-amber-200">PROMISE</span></header><main class="mx-auto max-w-4xl p-6 md:p-12"><p class="text-xs tracking-widest text-amber-200">NATAL CHART</p><h1 class="mt-3 text-3xl">ดวงชะตากำเนิด</h1><a href="/onboarding.html" class="mt-5 inline-block text-sm text-amber-200 underline">แก้ไขข้อมูลเกิด</a><div id="msg" class="mt-6 text-stone-400">กำลังคำนวณ…</div><div id="details" class="mt-5 grid gap-3 sm:grid-cols-2"></div><div id="planets" class="mt-5 grid gap-3 sm:grid-cols-3"></div><p class="mt-6 text-xs leading-6 text-stone-500">ตำแหน่งดาวเป็นค่าดาราศาสตร์ประมาณในระบบ tropical geocentric; ไม่ได้คำนวณเรือนชะตา/ดาวเคราะห์ครบทุกดวง ทั้งนี้การอ่านโหราศาสตร์ใช้เพื่อความบันเทิงและการใคร่ครวญ</p></main><script>const t=localStorage.getItem('token');if(!t)location.href='/login.html';else fetch('/api/astrology/chart',{headers:{Authorization:'Bearer '+t}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#msg').innerHTML=d.chart?'<span class="text-amber-200">ผูกดวงเรียบร้อย ✨</span>':'<span class="text-amber-200">'+(d.message||'ข้อมูลดวงกำเนิด')+'</span>';const p=d.profile;document.querySelector('#details').innerHTML=[['วันเกิด',p.birth_date],['เวลาเกิด',p.birth_time||'ไม่ระบุ'],['สถานที่',p.birth_place||p.birth_province],['พิกัด',p.lat+', '+p.lng],['เขตเวลา',p.timezone]].map(x=>`<div class="rounded-xl border border-white/10 bg-[#141416] p-4"><small class="text-stone-500">${x[0]}</small><div class="mt-1">${x[1]}</div></div>`).join('');if(d.chart){document.querySelector('#planets').innerHTML=[['ลัคนา',d.chart.ascendant],['อาทิตย์',d.chart.sun],['จันทร์',d.chart.moon]].map(([n,x])=>`<div class="rounded-2xl border border-amber-100/15 bg-[#141416] p-5"><small class="text-stone-400">${n}</small><h2 class="mt-2 text-xl text-amber-200">${x.sign}</h2><p class="mt-1 text-sm text-stone-400">${x.degree}° · ecliptic longitude ${x.longitude}°</p></div>`).join('')}else document.querySelector('#planets').innerHTML='<p class="text-stone-400">ระบุเวลาเกิดเพื่อคำนวณลัคนาและดาว</p>'}).catch(e=>document.querySelector('#msg').textContent=e.message);</script></body></html>
