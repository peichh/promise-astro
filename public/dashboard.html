<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROMISE • Dashboard</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet"><style>:root{color-scheme:dark;--bg:#0b0c10;--panel:#111218;--panel2:#161822;--gold:#d4af37;--gold2:#e5c158;--line:rgba(212,175,55,.2);--muted:#aaa9a4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1efe8;font:15px 'IBM Plex Sans Thai',sans-serif}main{max-width:1160px;margin:auto;padding:44px 22px 80px}.eyebrow{color:var(--gold2);font-size:11px;letter-spacing:.25em}.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:14px 0 30px}h1,h2{font-family:'Noto Serif Thai',serif;font-weight:400;margin:0}h1{font-size:clamp(30px,5vw,46px)}.tier{border:1px solid var(--gold);color:#f6e27a;padding:9px 15px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),var(--panel));border-radius:20px;padding:22px;min-width:0}.card h2{font-size:20px;margin-bottom:16px}.muted{color:var(--muted);font-size:13px;line-height:1.8}.facts{display:grid;gap:8px}.fact{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #262730;padding:8px 0;font-size:13px}.value{color:#e6d8af;text-align:right}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0}.action{display:inline-block;background:var(--gold);color:#101014;text-decoration:none;padding:12px 17px;border-radius:999px;font-weight:600}.action.alt{background:transparent;color:#e5c158;border:1px solid var(--line)}.activity{margin-top:18px}.activity a{display:block;text-decoration:none;color:#eee;padding:12px 0;border-bottom:1px solid #262730}.activity small{color:var(--muted);display:block}.loading{color:var(--muted)}@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding-top:30px}.welcome{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.tier{font-size:12px}}</style></head><body><main><p class="eyebrow">YOUR PERSONAL COSMOS</p><section class="welcome"><div><h1>ยินดีต้อนรับ <span id="welcomeName">กลับมา</span></h1><p class="muted">ภาพรวมจักรวาลส่วนตัวและพื้นที่สมาชิกของคุณ</p></div><span id="tierBadge" class="tier">กำลังโหลดแพลน…</span></section><section class="grid"><article class="card"><h2>ข้อมูลดวงชะตา</h2><div id="birth" class="loading">กำลังตรวจสอบข้อมูลเกิด…</div><p><a class="action alt" href="/onboarding.html">จัดการข้อมูลเกิด</a></p></article><article class="card"><h2>สมาชิกภาพ</h2><div id="membership" class="loading">กำลังโหลดสิทธิ์…</div><p><a class="action alt" href="/account.html">จัดการแพลน</a></p></article><article class="card"><h2>กิจกรรมล่าสุด</h2><div id="recent" class="activity loading">กำลังโหลดประวัติ…</div></article></section><section class="actions"><a class="action" href="/reading.html">เริ่มพยากรณ์ใหม่</a><a class="action alt" href="/natal.html">ดูผังดวงกำเนิด</a><a class="action alt" href="/onboarding.html">จัดการข้อมูล</a></section></main><script src="/js/promise-nav.js"></script><script>(()=>{const t=localStorage.getItem('token');const e=id=>document.getElementById(id);const tiers={free:'Free Explorer',basic:'Basic Star',premium:'PROMISE Member',pro:'PROMISE Member',lifetime:'VIP ตลอดชีพ',vip:'VIP ตลอดชีพ'};if(!t){location.href='/login.html';return}const req=(url)=>fetch(url,{headers:{Authorization:'Bearer '+t,Accept:'application/json'}}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error||'โหลดข้อมูลไม่สำเร็จ');return x});Promise.allSettled([req('/api/account'),req('/api/profile/birth'),req('/api/readings/history')]).then(([ar,br,hr])=>{let tier='free',user={};if(ar.status==='fulfilled'){user=ar.value.user||{};tier=String(user.tier||'free').toLowerCase();e('welcomeName').textContent=user.display_name||user.email?.split('@')[0]||'กลับมา'}else e('welcomeName').textContent='กลับมา';e('tierBadge').textContent=tiers[tier]||tier;if(tier==='lifetime'||tier==='vip')e('membership').innerHTML='<div class="facts"><div class="fact"><span>แพลน</span><span class="value">VIP ตลอดชีพ</span></div><div class="fact"><span>วันหมดอายุ</span><span class="value">ไม่มีวันหมดอายุ</span></div><div class="fact"><span>สิทธิ์อ่าน</span><span class="value">สิทธิ์สมาชิกสูงสุด</span></div></div>';else e('membership').innerHTML=`<div class="facts"><div class="fact"><span>แพลน</span><span class="value">${tiers[tier]||tier}</span></div><div class="fact"><span>วันหมดอายุ</span><span class="value">ดูรายละเอียดบัญชี</span></div><div class="fact"><span>สิทธิ์อ่าน</span><span class="value">ตามแพลน</span></div></div>`;if(br.status==='fulfilled'){const p=br.value.profile;if(p){e('birth').innerHTML=`<div class="facts"><div class="fact"><span>วันเกิด</span><span class="value">${p.birth_date||'—'}</span></div><div class="fact"><span>เวลาเกิด</span><span class="value">${p.birth_time||'ยังไม่ระบุ'}</span></div><div class="fact"><span>สถานที่</span><span class="value">${p.birth_place||p.birth_province||'—'}</span></div><div class="fact"><span>พิกัด</span><span class="value">${p.lat??'—'}, ${p.lng??'—'}</span></div></div>`}else e('birth').textContent='ยังไม่มีข้อมูลเกิดที่บันทึกไว้'}else e('birth').textContent='โหลดข้อมูลเกิดไม่สำเร็จ';if(hr.status==='fulfilled'){const rows=hr.value.readings||[];e('recent').innerHTML=rows.length?rows.slice(0,3).map(x=>`<a href="/history.html">${x.type||'คำอ่าน'} · ${x.question||'คำอ่านทั่วไป'}<small>${x.created_at?new Date(x.created_at).toLocaleString('th-TH'):'บันทึกแล้ว'}</small></a>`).join(''):'ยังไม่มีคำอ่านที่บันทึกไว้'}else e('recent').textContent='โหลดประวัติไม่สำเร็จ'})})();</script></body></html>
