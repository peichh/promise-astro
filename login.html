<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - PROMISE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#FFF8F0] flex min-h-screen items-center justify-center p-6">
<div class="w-full max-w-md bg-white rounded-[24px] p-8 shadow-xl">
<h1 class="text-2xl font-bold">เข้าสู่ระบบ</h1>
<form id="form" class="mt-6 space-y-4">
<input id="email" type="email" placeholder="อีเมล" class="w-full px-4 py-3 rounded-xl border" required>
<input id="password" type="password" placeholder="รหัสผ่าน" class="w-full px-4 py-3 rounded-xl border" required>
<button class="w-full py-3 rounded-xl bg-black text-white">เข้าสู่ระบบ</button>
</form>
<div id="msg" class="mt-4 text-sm"></div>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e)=>{
 e.preventDefault();
 const res = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});
 const data = await res.json();
 if(res.ok){localStorage.setItem('token',data.token); location.href='/dashboard.html';}
 else document.getElementById('msg').innerText=data.error;
});
</script>
</body></html>
