<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - PROMISE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#FFF8F0] min-h-screen">
<nav class="flex justify-between p-6 bg-white border-b"><div class="font-bold">PROMISE • Dashboard</div><a href="/book.html" class="px-4 py-2 bg-black text-white rounded-full text-sm">เปิดหนังสือของฉัน</a></nav>
<div class="max-w-6xl mx-auto p-6 grid md:grid-cols-3 gap-6">
<div class="bg-white rounded-2xl p-6"><h3 class="font-bold">ถามไพ่ทาโรต์</h3><select id="qtype" class="mt-3 w-full border rounded-xl p-3"><option>งาน</option><option>ความรัก</option></select><input id="question" placeholder="พิมพ์คำถาม เช่น งานจะเป็นยังไง" class="mt-3 w-full border rounded-xl p-3"><button id="ask" class="mt-3 w-full bg-black text-white py-3 rounded-xl">เปิดไพ่ 3 ใบ + ผูกกับดวงเกิด</button><div id="result" class="mt-4 text-sm whitespace-pre-wrap"></div></div>
<div class="bg-white rounded-2xl p-6"><h3 class="font-bold">ประวัติคำทำนาย</h3><div id="history" class="mt-3 text-xs opacity-60">โหลดจาก promise_readings</div></div>
<div class="bg-white rounded-2xl p-6"><h3 class="font-bold">สมาชิก</h3><p class="text-sm opacity-60 mt-2">สถานะ: Member | หนังสือของคุณกันก๊อปด้วย Canvas + Watermark + Session ล็อค</p><a href="/admin.html" class="text-xs underline">Admin Panel (เฉพาะ allowlist)</a></div>
</div>
<script>
document.getElementById('ask').addEventListener('click', async ()=>{
 const token = localStorage.getItem('token'); const user = JSON.parse(localStorage.getItem('user')||'{}');
 const res = await fetch('/api/readings/generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({user_id:user.id||user.uid,name:user.display_name||'มีนา',question:question.value,type:qtype.value})});
 const data = await res.json();
 document.getElementById('result').innerText = data.text + `\n\nseed:${data.seed} q:${data.q} blocks:${data.blocks||4}`;
});
</script>
</body></html>
